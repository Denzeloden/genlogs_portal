services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: genlogs
      POSTGRES_PASSWORD: genlogs
      POSTGRES_DB: genlogs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genlogs -d genlogs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://genlogs:genlogs@db:5432/genlogs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend/dist:/frontend/dist

volumes:
  postgres_data:
